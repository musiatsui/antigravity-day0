<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 첫 번째 아이디어</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 파란색 글자와 자연스럽게 어우러지는 딥 블루 & 네이비 그라데이션 */
      background: radial-gradient(circle at center, #0f2744 0%, #091322 60%, #030712 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 배경 중앙의 은은한 블루 글로우 조명 */
    body::before {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, rgba(37, 99, 235, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
      animation: pulse 4s ease-in-out infinite alternate;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 3.5rem;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 35px rgba(37, 99, 235, 0.2);
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      /* 생동감 넘치고 깊이감 있는 파란색 그라데이션 */
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 45%, #1d4ed8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.5));
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(16px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.15);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>내 첫 번째 아이디어</h1>
  </main>
</body>
</html>
