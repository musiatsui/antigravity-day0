<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘도 힘 내세요!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 부드럽고 세련된 라이트 그레이 멀티 레이어 그라데이션 */
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 45%, #e2e8f0 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 배경의 은은한 앰비언트 실버/웜화이트 조명 효과 */
    .ambient-sphere-1 {
      position: absolute;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(226, 232, 240, 0.6) 65%, rgba(226, 232, 240, 0) 100%);
      border-radius: 50%;
      top: -12%;
      left: 12%;
      filter: blur(50px);
      pointer-events: none;
      animation: floatA 9s ease-in-out infinite alternate;
    }

    .ambient-sphere-2 {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(203, 213, 225, 0.5) 0%, rgba(241, 245, 249, 0.2) 65%, rgba(241, 245, 249, 0) 100%);
      border-radius: 50%;
      bottom: -15%;
      right: 14%;
      filter: blur(55px);
      pointer-events: none;
      animation: floatB 10s ease-in-out infinite alternate;
    }

    /* 프리미엄 글래스모피즘 카드 컨테이너 */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3.25rem 4rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      box-shadow:
        0 20px 45px -10px rgba(15, 23, 42, 0.09),
        0 10px 20px -5px rgba(15, 23, 42, 0.05),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow:
        0 30px 60px -15px rgba(15, 23, 42, 0.14),
        0 15px 25px -5px rgba(15, 23, 42, 0.08),
        0 0 0 1px rgba(255, 255, 255, 1) inset;
    }

    /* 상단 상태 뱃지 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(241, 245, 249, 0.85);
      border: 1px solid rgba(203, 213, 225, 0.6);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
      animation: pulseDot 2s infinite;
    }

    /* 메인 타이틀: 40px 크기 & 깊이감 있는 딥 슬레이트 그라데이션 */
    h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.3;
      color: #0f172a;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.08));
      transition: opacity 0.2s ease, transform 0.2s ease;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 인터랙티브 응원 버튼 */
    .action-container {
      margin-top: 2rem;
    }

    .cheer-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
      letter-spacing: -0.01em;
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
    }

    .cheer-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
    }

    /* 기본 버튼 (오늘도 힘내세요!) */
    .cheer-btn.btn-default {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18);
    }

    .cheer-btn.btn-default:hover {
      background: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25);
    }

    /* 노란색 버튼 (오늘도 해냈어요!) */
    .cheer-btn.btn-yellow {
      background: #eab308;
      color: #0f172a;
      box-shadow: 0 4px 16px rgba(234, 179, 8, 0.4);
    }

    .cheer-btn.btn-yellow:hover {
      background: #ca8a04;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(234, 179, 8, 0.5);
    }

    /* 주황색 버튼 (조금씩 나아지고 있어요.) */
    .cheer-btn.btn-orange {
      background: #f97316;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(249, 115, 22, 0.4);
    }

    .cheer-btn.btn-orange:hover {
      background: #ea580c;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(249, 115, 22, 0.5);
    }

    /* 초록색 버튼 (이대로 계속 가봅시다.) */
    .cheer-btn.btn-green {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(22, 163, 74, 0.4);
    }

    .cheer-btn.btn-green:hover {
      background: #15803d;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(22, 163, 74, 0.5);
    }

    /* 애니메이션 */
    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes floatA {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(30px, 25px) scale(1.08);
      }
    }

    @keyframes floatB {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(-25px, -20px) scale(1.05);
      }
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }
  </style>
</head>

<body>
  <div class="ambient-sphere-1"></div>
  <div class="ambient-sphere-2"></div>

  <main class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>오늘의 응원</span>
    </div>

    <h1 id="mainHeading">오늘도 힘내세요!</h1>

    <div class="action-container">
      <button class="cheer-btn btn-default" id="cheerBtn">
        <span>✨</span>
        <span id="btnText">다음 문장 보기</span>
      </button>
    </div>
  </main>

  <script>
    const cheerHeadings = [
      { text: "오늘도 힘내세요!", btnClass: "btn-default" },
      { text: "오늘도 해냈어요!", btnClass: "btn-yellow" },
      { text: "조금씩 나아지고 있어요", btnClass: "btn-orange" },
      { text: "이대로 계속 가봅시다.", btnClass: "btn-green" }
    ];

    let currentIdx = 0;
    const mainHeading = document.getElementById('mainHeading');
    const cheerBtn = document.getElementById('cheerBtn');

    // URL 파라미터(?idx=0~3) 지원
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('idx')) {
      const pIdx = parseInt(urlParams.get('idx'), 10);
      if (!isNaN(pIdx) && pIdx >= 0 && pIdx < cheerHeadings.length) {
        currentIdx = pIdx;
        const item = cheerHeadings[currentIdx];
        mainHeading.textContent = item.text;
        cheerBtn.className = `cheer-btn ${item.btnClass}`;
      }
    }

    cheerBtn.addEventListener('click', () => {
      currentIdx = (currentIdx + 1) % cheerHeadings.length;
      const currentItem = cheerHeadings[currentIdx];

      // 버튼 색상 부드럽게 변경
      cheerBtn.className = `cheer-btn ${currentItem.btnClass}`;

      // 메인 문장 부드러운 전환 효과
      mainHeading.style.opacity = '0';
      mainHeading.style.transform = 'scale(0.96) translateY(-4px)';

      setTimeout(() => {
        mainHeading.textContent = currentItem.text;
        mainHeading.style.opacity = '1';
        mainHeading.style.transform = 'scale(1) translateY(0)';
      }, 150);
    });
  </script>
</body>

</html>
